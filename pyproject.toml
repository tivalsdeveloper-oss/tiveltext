[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tiveltext"
version = "1.1.0.dev0"
description = "Stylized terminal text, ASCII art, Unicode typography, colors, backgrounds, and text effects for Python."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Tivalsdeveloper"}]
keywords = ["ascii", "unicode", "text", "typography", "terminal", "color", "gradient", "banner", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent"
]

[project.scripts]
tiveltext = "tiveltext.cli:main"

[project.urls]
Homepage = "https://github.com/tivalsdeveloper-oss/tiveltext"
Repository = "https://github.com/tivalsdeveloper-oss/tiveltext"

[tool.hatch.build.targets.wheel]
packages = ["src/tiveltext"]
